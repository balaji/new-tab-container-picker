<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Choose Container</title>
  <link rel="stylesheet" href="picker.css">
</head>
<body>
  <main class="picker">
    <div id="target-url-banner" class="target-url-banner" hidden>
      <svg class="target-url-icon" aria-hidden="true" viewBox="0 0 16 16" fill="none">
        <path
          d="M6.75 9.25L9.25 6.75M6 10.75L4.75 12C3.78 12.97 2.22 12.97 1.25 12C0.28 11.03 0.28 9.47 1.25 8.5L2.5 7.25M10 5.25L11.25 4C12.22 3.03 13.78 3.03 14.75 4C15.72 4.97 15.72 6.53 14.75 7.5L13.5 8.75"
          stroke="currentColor"
          stroke-width="1.35"
          stroke-linecap="round"
        />
      </svg>
      <span id="target-url-text" class="target-url-text"></span>
    </div>

    <header class="search-header">
      <label for="container-search" class="visually-hidden">Search containers</label>
      <div class="search-field">
        <svg class="search-icon" aria-hidden="true" viewBox="0 0 16 16" fill="none">
          <circle cx="7" cy="7" r="4.75" stroke="currentColor" stroke-width="1.5" />
          <path d="M10.5 10.5L13.75 13.75" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
        </svg>
        <input
          id="container-search"
          class="search-input"
          type="search"
          role="combobox"
          aria-autocomplete="list"
          aria-expanded="true"
          aria-controls="container-list"
          autocomplete="off"
          spellcheck="false"
          placeholder="Search containers…"
          autofocus
        >
      </div>
    </header>

    <div class="list-wrapper">
      <ul
        id="container-list"
        class="container-list"
        role="listbox"
        aria-label="Containers"
      ></ul>
      <p id="empty-state" class="empty-state" hidden>No matching containers</p>
    </div>

    <p id="picker-error" class="picker-error" hidden></p>

    <div
      id="status-announcer"
      class="visually-hidden"
      aria-live="polite"
      aria-atomic="true"
    ></div>

    <footer class="picker-footer">
      <div class="footer-hints">
        <span class="hint"><kbd>↑↓</kbd> Navigate</span>
        <span class="hint"><kbd>↵</kbd> Open</span>
        <span class="hint"><kbd>Esc</kbd> Dismiss</span>
      </div>
      <button
        id="open-settings"
        class="settings-button"
        type="button"
        title="Extension settings"
        aria-label="Extension settings"
      >
        <svg class="settings-icon" viewBox="0 0 16 16" fill="none" aria-hidden="true">
          <path
            d="M7 1.5H9L9.9 3.4L11.9 2.7L13.3 4.1L12.6 6.1L14.5 7V9L12.6 9.9L13.3 11.9L11.9 13.3L9.9 12.6L9 14.5H7L6.1 12.6L4.1 13.3L2.7 11.9L3.4 9.9L1.5 9V7L3.4 6.1L2.7 4.1L4.1 2.7L6.1 3.4Z"
            stroke="currentColor"
            stroke-width="1.25"
            stroke-linejoin="round"
          />
          <circle cx="8" cy="8" r="2.2" stroke="currentColor" stroke-width="1.25" />
        </svg>
      </button>
    </footer>
  </main>

  <script type="module" src="picker.js"></script>
</body>
</html>
