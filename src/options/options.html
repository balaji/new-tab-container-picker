<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>New Tab Container Picker Settings</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <main class="options-page">
    <section class="settings-list" aria-label="Picker settings">
      <div class="setting-row setting-row--shortcut">
        <div class="setting-copy">
          <span class="setting-title">Keyboard shortcut</span>
          <span id="setting-shortcut-desc" class="setting-description">
            Shortcut to open the container picker popup. Click the field and press a key combination, or manage it in Firefox’s Manage Extension Shortcuts. Clicking the toolbar icon also opens the popup.
          </span>
        </div>
        <div class="shortcut-controls">
          <input
            id="setting-shortcut"
            class="shortcut-input"
            type="text"
            readonly
            aria-label="Keyboard shortcut"
            aria-describedby="setting-shortcut-desc"
            placeholder="Press shortcut…"
          >
          <button
            id="shortcut-reset"
            class="shortcut-button"
            type="button"
            title="Reset to default shortcut"
          >
            Reset
          </button>
          <button
            id="shortcut-clear"
            class="shortcut-button"
            type="button"
            title="Clear shortcut"
          >
            Clear
          </button>
        </div>
      </div>

      <label class="setting-row" for="setting-open-on-new-tab">
        <span class="setting-copy">
          <span class="setting-title">Open picker on new tabs (Cmd+T / Ctrl+T)</span>
          <span id="setting-open-on-new-tab-desc" class="setting-description">
            Open the container picker directly inside new tabs. Requests optional tab &amp; recently closed session permissions.
          </span>
        </span>
        <span class="toggle-control">
          <input
            id="setting-open-on-new-tab"
            class="toggle-input"
            type="checkbox"
            aria-describedby="setting-open-on-new-tab-desc"
          >
          <span class="toggle-track" aria-hidden="true"></span>
        </span>
      </label>

      <label class="setting-row" for="setting-auto-open">
        <span class="setting-copy">
          <span class="setting-title">Auto-open on single search match</span>
          <span id="setting-auto-open-desc" class="setting-description">
            Automatically open the matching container tab without pressing Enter as soon as your search narrows the list down to one result.
          </span>
        </span>
        <span class="toggle-control">
          <input
            id="setting-auto-open"
            class="toggle-input"
            type="checkbox"
            aria-describedby="setting-auto-open-desc"
          >
          <span class="toggle-track" aria-hidden="true"></span>
        </span>
      </label>
    </section>

    <p id="save-status" class="save-status" role="status" aria-live="polite"></p>
  </main>

  <script type="module" src="options.js"></script>
</body>
</html>
